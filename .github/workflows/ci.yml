name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contrast
      - run: npm run build
      - run: npm run preflight:mcp

  agent-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/python -m pip install -r agent/requirements.txt
      - run: npm run test:agent

  # The same server and store tests against the DynamoDB store on DynamoDB Local. No AWS account.
  dynamodb-local:
    runs-on: ubuntu-24.04
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for DynamoDB Local
        run: for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8000 && exit 0; sleep 1; done; exit 1
      - run: npm test
        env:
          LINELEDGER_TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          LINELEDGER_TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:8000

  # A real browser against the real server, the web client and the running simulation (SQLite in memory).
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
